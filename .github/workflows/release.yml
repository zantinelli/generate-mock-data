name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build archives
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          PREFIX="generate-mock-data-${TAG}/"
          git archive --format=tar.gz --prefix="$PREFIX" -o "generate-mock-data-${TAG}.tar.gz" HEAD
          git archive --format=zip --prefix="$PREFIX" -o "generate-mock-data-${TAG}.zip" HEAD

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            generate-mock-data-*.tar.gz
            generate-mock-data-*.zip
